[package]
name = "rookery-chess"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust chess with GPUI Kit, a built-in engine and direct P2P play"

[dependencies]
gpui-kit = "0.7.1"
shakmaty = "0.30.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package]
gpui-pre = { opt-level = 2 }
gpui-component = { opt-level = 2 }
gpui-kit = { opt-level = 2 }
